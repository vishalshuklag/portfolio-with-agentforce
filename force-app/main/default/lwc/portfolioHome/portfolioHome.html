<template>
  <div class="pf-root">
    <!-- ============ Sticky nav ============ -->
    <header class="nav">
      <div class="nav-inner">
        <button class="brand" data-target="top" onclick={handleNav}>
          <span class="brand-mark">{initials}</span>
          <span class="brand-name">{ownerName}</span>
        </button>
        <nav class="nav-links">
          <template for:each={navItems} for:item="n">
            <a
              key={n.key}
              href="#"
              class="nav-link"
              data-target={n.target}
              onclick={handleNav}
              >{n.label}</a
            >
          </template>
        </nav>
        <div class="nav-actions">
          <template lwc:if={hasResume}>
            <a
              class="btn btn-ghost"
              href={resumeLink}
              target="_blank"
              rel="noopener noreferrer"
            >
              Resume
            </a>
          </template>
          <button
            class="btn btn-ghost"
            onclick={handleDownloadPdf}
            disabled={pdfBusy}
          >
            <lightning-icon
              icon-name="utility:download"
              size="xx-small"
            ></lightning-icon>
            <span>PDF</span>
          </button>
          <button class="btn btn-primary" onclick={handleAskAI}>
            <lightning-icon
              icon-name="utility:einstein"
              size="xx-small"
              variant="inverse"
            ></lightning-icon>
            <span>Ask AI</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ============ Hero ============ -->
    <section class="hero" data-section="top">
      <div class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">{computedRole}</p>
          <h1 class="headline">{computedHeadline}</h1>
          <p class="subheadline">{subheadline}</p>

          <div class="hero-actions">
            <button class="btn btn-primary btn-lg" onclick={handleAskAI}>
              <lightning-icon
                icon-name="utility:einstein"
                size="x-small"
                variant="inverse"
              ></lightning-icon>
              <span>Chat with my AI assistant</span>
            </button>
            <template lwc:if={hasResume}>
              <a
                class="btn btn-outline btn-lg"
                href={resumeLink}
                target="_blank"
                rel="noopener noreferrer"
              >
                <lightning-icon
                  icon-name="utility:download"
                  size="xx-small"
                ></lightning-icon>
                <span>View resume</span>
              </a>
            </template>
            <button
              class="btn btn-outline btn-lg"
              onclick={handleDownloadPdf}
              disabled={pdfBusy}
            >
              <lightning-icon
                icon-name="utility:download"
                size="xx-small"
              ></lightning-icon>
              <span>Download resume (PDF)</span>
            </button>
          </div>

          <div class="hero-foot">
            <template lwc:if={hasLocation}>
              <span class="hero-loc">
                <lightning-icon
                  icon-name="utility:location"
                  size="xx-small"
                ></lightning-icon>
                {location}
              </span>
            </template>
            <template lwc:if={hasSocials}>
              <div class="socials">
                <template for:each={socialLinks} for:item="s">
                  <a
                    key={s.id}
                    class="social-btn"
                    href={s.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    title={s.label}
                  >
                    <lightning-icon
                      icon-name={s.iconName}
                      size="x-small"
                      alternative-text={s.label}
                    ></lightning-icon>
                  </a>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div class="hero-visual">
          <div class="avatar">
            <template lwc:if={hasAvatar}>
              <img src={avatarUrl} alt={ownerName} onerror={handleImageError} />
            </template>
            <template lwc:else>
              <span class="avatar-initials">{initials}</span>
            </template>
          </div>
          <div class="avatar-glow"></div>
        </div>
      </div>
    </section>

    <!-- ============ States ============ -->
    <template lwc:if={loading}>
      <div class="section">
        <div class="grid grid-3">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </template>

    <template lwc:if={hasError}>
      <div class="section">
        <p class="notice">
          Couldn't load portfolio content right now. Please refresh in a moment.
        </p>
      </div>
    </template>

    <!-- ============ Content sections ============ -->
    <template lwc:if={showSections}>
      <!-- By the numbers -->
      <template lwc:if={hasStats}>
        <section class="section section-tight">
          <div class="stats">
            <template for:each={stats} for:item="stat">
              <div key={stat.key} class="stat-tile">
                <span class="stat-value">{stat.value}</span>
                <span class="stat-label">{stat.label}</span>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Currently -->
      <template lwc:if={hasNow}>
        <section class="section section-tight">
          <div class="now-callout">
            <span class="now-label">
              <lightning-icon
                icon-name="utility:clock"
                size="xx-small"
              ></lightning-icon>
              Currently
            </span>
            <div class="now-body">
              <h3 class="now-title">{nowItem.title}</h3>
              <template lwc:if={nowItem.hasDescription}>
                <p class="now-text">{nowItem.description}</p>
              </template>
            </div>
          </div>
        </section>
      </template>

      <!-- About -->
      <template lwc:if={hasAbout}>
        <section class="section" data-section="about">
          <div class="section-head">
            <p class="section-eyebrow">About</p>
            <h2 class="section-title">{computedHeadline}</h2>
          </div>
          <template if:true={aboutLead}>
            <div class="about-card">
              <template lwc:if={aboutLead.hasDescription}>
                <p class="about-text">{aboutLead.description}</p>
              </template>
              <template lwc:if={aboutLead.hasUrl}>
                <a
                  class="text-link"
                  href={aboutLead.url}
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {aboutLead.ctaLabel}
                  <lightning-icon
                    icon-name="utility:forward"
                    size="xx-small"
                  ></lightning-icon>
                </a>
              </template>
            </div>
          </template>
        </section>
      </template>

      <!-- Skills -->
      <template lwc:if={hasSkills}>
        <section class="section" data-section="skills">
          <div class="section-head">
            <p class="section-eyebrow">Toolkit</p>
            <h2 class="section-title">Skills</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={skillItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasTags}>
                    <div class="tags">
                      <template for:each={item.tags} for:item="tag">
                        <span key={tag.key} class="tag">{tag.label}</span>
                      </template>
                    </div>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- AI usage -->
      <template lwc:if={hasAiTools}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">How I work</p>
            <h2 class="section-title">AI usage</h2>
            <p class="section-sub">
              The AI tools I lean on day to day — and what I use each one for.
            </p>
          </div>
          <div class="grid grid-3">
            <template for:each={aiToolItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Services -->
      <template lwc:if={hasServices}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">What I offer</p>
            <h2 class="section-title">Services</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={serviceItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Featured + Projects -->
      <template lwc:if={hasFeatured}>
        <section class="section" data-section="work">
          <div class="section-head">
            <p class="section-eyebrow">Selected work</p>
            <h2 class="section-title">Featured</h2>
            <p class="section-sub">
              A few highlights — ask the assistant for the full story behind any
              of them.
            </p>
          </div>
          <div class="grid grid-2">
            <template for:each={featuredItems} for:item="item">
              <article key={item.id} class="feature-card">
                <template lwc:if={item.hasImage}>
                  <div class="media media-wide">
                    <img
                      src={item.imageUrl}
                      alt={item.title}
                      loading="lazy"
                      onerror={handleImageError}
                    />
                    <span class="media-fallback">
                      <lightning-icon
                        icon-name={item.iconName}
                        size="small"
                        variant="inverse"
                      ></lightning-icon>
                    </span>
                  </div>
                </template>
                <div class="feature-body">
                  <span class={item.badgeClass}>{item.typeLabel}</span>
                  <h3 class="feature-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="feature-desc">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasTags}>
                    <div class="tags">
                      <template for:each={item.tags} for:item="tag">
                        <span key={tag.key} class="tag">{tag.label}</span>
                      </template>
                    </div>
                  </template>
                  <div class="card-links">
                    <template lwc:if={item.hasUrl}>
                      <a
                        class="text-link"
                        href={item.url}
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        {item.ctaLabel}
                        <lightning-icon
                          icon-name="utility:forward"
                          size="xx-small"
                        ></lightning-icon>
                      </a>
                    </template>
                    <template lwc:if={item.hasSecondary}>
                      <a
                        class="text-link text-link-muted"
                        href={item.secondaryUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        Source
                        <lightning-icon
                          icon-name="utility:link"
                          size="xx-small"
                        ></lightning-icon>
                      </a>
                    </template>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <template lwc:if={hasProjects}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Portfolio</p>
            <h2 class="section-title">Projects</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={projectItems} for:item="item">
              <article key={item.id} class="card">
                <template lwc:if={item.hasImage}>
                  <div class="media">
                    <img
                      src={item.imageUrl}
                      alt={item.title}
                      loading="lazy"
                      onerror={handleImageError}
                    />
                    <span class="media-fallback">
                      <lightning-icon
                        icon-name={item.iconName}
                        size="small"
                        variant="inverse"
                      ></lightning-icon>
                    </span>
                  </div>
                </template>
                <div class="card-body">
                  <span class={item.badgeClass}>{item.typeLabel}</span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasTags}>
                    <div class="tags">
                      <template for:each={item.tags} for:item="tag">
                        <span key={tag.key} class="tag">{tag.label}</span>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Experience timeline -->
      <template lwc:if={hasExperience}>
        <section class="section" data-section="experience">
          <div class="section-head">
            <p class="section-eyebrow">Background</p>
            <h2 class="section-title">Experience</h2>
          </div>
          <ol class="timeline">
            <template for:each={experienceItems} for:item="item">
              <li key={item.id} class="timeline-item">
                <span class="timeline-dot"></span>
                <div class="timeline-content">
                  <template lwc:if={item.hasTimeframe}>
                    <span class="timeline-date">{item.timeframe}</span>
                  </template>
                  <h3 class="timeline-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="timeline-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="timeline-desc">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </li>
            </template>
          </ol>
        </section>
      </template>

      <!-- Education timeline -->
      <template lwc:if={hasEducation}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Background</p>
            <h2 class="section-title">Education</h2>
          </div>
          <ol class="timeline">
            <template for:each={educationItems} for:item="item">
              <li key={item.id} class="timeline-item">
                <span class="timeline-dot"></span>
                <div class="timeline-content">
                  <template lwc:if={item.hasTimeframe}>
                    <span class="timeline-date">{item.timeframe}</span>
                  </template>
                  <h3 class="timeline-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="timeline-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="timeline-desc">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </li>
            </template>
          </ol>
        </section>
      </template>

      <!-- Certifications -->
      <template lwc:if={hasCerts}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Credentials</p>
            <h2 class="section-title">Certifications</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={certItems} for:item="item">
              <article key={item.id} class="cert-card">
                <div class="cert-badge">
                  <template lwc:if={item.hasImage}>
                    <img
                      src={item.imageUrl}
                      alt={item.title}
                      loading="lazy"
                      onerror={handleImageError}
                    />
                  </template>
                  <span class="cert-fallback">
                    <lightning-icon
                      icon-name="utility:trophy"
                      size="small"
                    ></lightning-icon>
                  </span>
                </div>
                <div class="cert-body">
                  <h3 class="cert-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="cert-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Awards & recognition -->
      <template lwc:if={hasAwards}>
        <section class="section" data-section="community">
          <div class="section-head">
            <p class="section-eyebrow">Recognition</p>
            <h2 class="section-title">Awards &amp; rewards</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={awardItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasTimeframe}>
                    <span class="timeline-date">{item.timeframe}</span>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Endorsements -->
      <template lwc:if={hasEndorsements}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Kind words</p>
            <h2 class="section-title">Endorsements</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={endorsementItems} for:item="item">
              <figure key={item.id} class="quote-card">
                <span class="quote-mark">&ldquo;</span>
                <blockquote class="quote-text">{item.description}</blockquote>
                <figcaption class="quote-author">
                  <span class="quote-avatar">{item.initials}</span>
                  <span class="quote-meta">
                    <span class="quote-name">{item.title}</span>
                    <template lwc:if={item.hasSubtitle}>
                      <span class="quote-role">{item.subtitle}</span>
                    </template>
                  </span>
                </figcaption>
              </figure>
            </template>
          </div>
        </section>
      </template>

      <!-- Community contributions -->
      <template lwc:if={hasCommunity}>
        <section class="section" data-section="community">
          <div class="section-head">
            <p class="section-eyebrow">Giving back</p>
            <h2 class="section-title">Community contributions</h2>
            <p class="section-sub">
              Mentoring, speaking, and the things I do to grow the ecosystem.
            </p>
          </div>
          <div class="grid grid-3">
            <template for:each={communityItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasTags}>
                    <div class="tags">
                      <template for:each={item.tags} for:item="tag">
                        <span key={tag.key} class="tag">{tag.label}</span>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Volunteering -->
      <template lwc:if={hasVolunteer}>
        <section class="section" data-section="community">
          <div class="section-head">
            <p class="section-eyebrow">Service</p>
            <h2 class="section-title">Volunteering</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={volunteerItems} for:item="item">
              <article key={item.id} class="card">
                <div class="card-body">
                  <span class="card-icon">
                    <lightning-icon
                      icon-name={item.iconName}
                      size="small"
                    ></lightning-icon>
                  </span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasTimeframe}>
                    <span class="timeline-date">{item.timeframe}</span>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Writing + Videos -->
      <template lwc:if={hasWriting}>
        <section class="section" data-section="content">
          <div class="section-head">
            <p class="section-eyebrow">Words</p>
            <h2 class="section-title">Writing &amp; talks</h2>
          </div>
          <div class="rows">
            <template for:each={writingItems} for:item="item">
              <a
                key={item.id}
                class="row"
                href={item.url}
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class={item.badgeClass}>{item.typeLabel}</span>
                <div class="row-main">
                  <h3 class="row-title">{item.title}</h3>
                  <template lwc:if={item.hasDescription}>
                    <p class="row-desc">{item.description}</p>
                  </template>
                </div>
                <lightning-icon
                  class="row-arrow"
                  icon-name="utility:forward"
                  size="x-small"
                ></lightning-icon>
              </a>
            </template>
          </div>
        </section>
      </template>

      <template lwc:if={hasVideos}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Watch</p>
            <h2 class="section-title">Videos</h2>
          </div>
          <div class="grid grid-3">
            <template for:each={videoItems} for:item="item">
              <article key={item.id} class="card">
                <div class="media">
                  <span class="media-fallback">
                    <lightning-icon
                      icon-name="utility:video"
                      size="small"
                      variant="inverse"
                      alternative-text="Video"
                    ></lightning-icon>
                  </span>
                  <template lwc:if={item.isPlaying}>
                    <div class="embed">
                      <iframe
                        src={item.embedUrl}
                        title={item.title}
                        frameborder="0"
                        allow="
                          accelerometer;
                          autoplay;
                          clipboard-write;
                          encrypted-media;
                          gyroscope;
                          picture-in-picture;
                        "
                        allowfullscreen
                      ></iframe>
                    </div>
                  </template>
                  <template lwc:elseif={item.isVideo}>
                    <button
                      class="thumb"
                      data-id={item.id}
                      onclick={handlePlay}
                      title="Play video"
                    >
                      <template lwc:if={item.imageUrl}>
                        <img
                          src={item.imageUrl}
                          alt={item.title}
                          loading="lazy"
                          onerror={handleImageError}
                        />
                      </template>
                      <span class="play-badge">
                        <lightning-icon
                          icon-name="utility:play"
                          size="small"
                          variant="inverse"
                          alternative-text="Play"
                        ></lightning-icon>
                      </span>
                    </button>
                  </template>
                  <template lwc:elseif={item.imageUrl}>
                    <img
                      src={item.imageUrl}
                      alt={item.title}
                      loading="lazy"
                      onerror={handleImageError}
                    />
                  </template>
                </div>
                <div class="card-body">
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc">{item.description}</p>
                  </template>
                  <template lwc:if={item.showVideoCta}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:new_window"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>

      <!-- Languages -->
      <template lwc:if={hasLanguages}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Spoken</p>
            <h2 class="section-title">Languages</h2>
          </div>
          <div class="lang-list">
            <template for:each={languageItems} for:item="item">
              <div key={item.id} class="lang-chip">
                <span class="lang-name">{item.title}</span>
                <template lwc:if={item.hasSubtitle}>
                  <span class="lang-level">{item.subtitle}</span>
                </template>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Interests -->
      <template lwc:if={hasInterests}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Beyond work</p>
            <h2 class="section-title">Interests</h2>
          </div>
          <div class="interest-grid">
            <template for:each={interestItems} for:item="item">
              <div key={item.id} class="interest-card">
                <span class="interest-icon">
                  <lightning-icon
                    icon-name={item.iconName}
                    size="small"
                  ></lightning-icon>
                </span>
                <div class="interest-main">
                  <h3 class="interest-title">{item.title}</h3>
                  <template lwc:if={item.hasDescription}>
                    <p class="interest-desc">{item.description}</p>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- Profiles -->
      <template lwc:if={hasLinks}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Elsewhere</p>
            <h2 class="section-title">Profiles &amp; links</h2>
          </div>
          <div class="chips">
            <template for:each={linkItems} for:item="item">
              <a
                key={item.id}
                class="link-chip"
                href={item.url}
                target="_blank"
                rel="noopener noreferrer"
              >
                <template lwc:if={item.showLinkPreview}>
                  <img
                    class="favicon"
                    src={item.faviconUrl}
                    alt=""
                    loading="lazy"
                    onerror={handleImageError}
                  />
                </template>
                <span>{item.title}</span>
                <lightning-icon
                  icon-name="utility:new_window"
                  size="xx-small"
                ></lightning-icon>
              </a>
            </template>
          </div>
        </section>
      </template>

      <!-- More — anything not covered by a dedicated section above -->
      <template lwc:if={hasOther}>
        <section class="section">
          <div class="section-head">
            <p class="section-eyebrow">Also worth a mention</p>
            <h2 class="section-title">More</h2>
            <p class="section-sub">
              Everything else that doesn't fit neatly into the sections above.
            </p>
          </div>
          <div class="grid grid-3">
            <template for:each={otherItems} for:item="item">
              <article key={item.id} class="card">
                <template lwc:if={item.hasImage}>
                  <div class="media">
                    <img
                      src={item.imageUrl}
                      alt={item.title}
                      loading="lazy"
                      onerror={handleImageError}
                    />
                    <span class="media-fallback">
                      <lightning-icon
                        icon-name={item.iconName}
                        size="small"
                        variant="inverse"
                      ></lightning-icon>
                    </span>
                  </div>
                </template>
                <div class="card-body">
                  <span class={item.badgeClass}>{item.typeLabel}</span>
                  <h3 class="card-title">{item.title}</h3>
                  <template lwc:if={item.hasSubtitle}>
                    <p class="feature-subtitle">{item.subtitle}</p>
                  </template>
                  <template lwc:if={item.hasTimeframe}>
                    <span class="timeline-date">{item.timeframe}</span>
                  </template>
                  <template lwc:if={item.hasDescription}>
                    <p class="card-desc detail">{item.description}</p>
                  </template>
                  <template lwc:if={item.hasTags}>
                    <div class="tags">
                      <template for:each={item.tags} for:item="tag">
                        <span key={tag.key} class="tag">{tag.label}</span>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={item.hasUrl}>
                    <a
                      class="text-link"
                      href={item.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {item.ctaLabel}
                      <lightning-icon
                        icon-name="utility:forward"
                        size="xx-small"
                      ></lightning-icon>
                    </a>
                  </template>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>
    </template>

    <!-- ============ Contact / Ask AI band ============ -->
    <section class="cta-band" data-section="contact">
      <div class="cta-inner">
        <lightning-icon
          icon-name="utility:einstein"
          size="medium"
          variant="inverse"
        ></lightning-icon>
        <h2 class="cta-title">Have a question? Just ask.</h2>
        <p class="cta-sub">
          My AI assistant knows my background, experience, and work — and can
          pass a message to me directly.
        </p>
        <button class="btn btn-light btn-lg" onclick={handleAskAI}>
          <lightning-icon
            icon-name="utility:chat"
            size="x-small"
          ></lightning-icon>
          <span>Start a conversation</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span>{ownerName}</span>
      <span class="footer-dot">•</span>
      <span>Built on Salesforce with an Agentforce assistant</span>
    </footer>
  </div>
</template>
